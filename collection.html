<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // Apply saved theme's background instantly, before the stylesheet loads,
    // so reloading a page never flashes a white screen.
    (function () {
      var t = localStorage.getItem('site_theme') || 'light';
      var bg = { light: '#f9fafb', dark: '#0f172a', sepia: '#f4eae1' }[t] || '#f9fafb';
      document.documentElement.style.backgroundColor = bg;
      document.body && (document.body.style.backgroundColor = bg);
    })();
  </script>
  <title>Add Recipes</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js" defer></script>
  <script src="js/themes.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="nav-link">My Collection</a>
    <a href="explore.html" class="nav-link">Explore Community</a>
    <a href="collection.html" class="nav-link active">Add Recipes</a>
  </nav>

  <main class="container">
    <h1>Add a New Recipe</h1>
    <p>Recipes you add are saved to your collection and shared with the community.</p>

    <div class="toggle-actions" style="margin-top: 24px;">
      <button id="toggle-ai" class="filter-btn active">✨ AI Parser</button>
      <button id="toggle-manual" class="filter-btn">📝 Manual Entry</button>
    </div>

    <div id="ai-view" class="input-card">
      <div class="form-group">
        <label>Recipe URL or Messy Text</label>
        <textarea id="recipe-input" rows="8" placeholder="Paste a recipe URL, or copy-paste the recipe text here..."></textarea>
      </div>
      <div class="actions">
        <button id="submit-btn" class="primary-btn">✨ Parse with AI</button>
      </div>
    </div>

    <div id="manual-view" class="input-card hidden">
      <form id="manual-form">
        <div class="form-group">
          <label>Recipe Title</label>
          <input type="text" id="manual-title" placeholder="e.g., Mom's Lasagna" required>
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="manual-category">
            <option value="Dinner">Dinner</option>
            <option value="Breakfast">Breakfast</option>
            <option value="Lunch">Lunch</option>
            <option value="Dessert">Dessert</option>
            <option value="Snack">Snack</option>
          </select>
        </div>
        <div class="form-group">
          <label>Preparation Time</label>
          <input type="text" id="manual-time" placeholder="e.g., 45 mins">
        </div>
        <div class="form-group">
          <label>Ingredients (One item per line)</label>
          <textarea id="manual-ingredients" rows="5" placeholder="1 lb ground beef&#10;2 cups mozzarella&#10;1 pack lasagna sheets"></textarea>
        </div>
        <div class="form-group">
          <label>Instructions (One step per line)</label>
          <textarea id="manual-instructions" rows="5" placeholder="Brown the beef in a pan.&#10;Layer noodles and cheese inside oven tray.&#10;Bake at 375°F for 30 mins."></textarea>
        </div>
        <div class="form-group">
          <label>Source Web link (Optional)</label>
          <input type="url" id="manual-url" placeholder="https://site.com">
        </div>
        <div class="actions">
          <button type="submit" class="primary-btn">💾 Save Recipe</button>
        </div>
      </form>
    </div>

    <div id="status-message" class="status-box hidden"></div>
  </main>

  <script src="js/storage.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const session = await requireLogin();
        if (!session) return;

        document.getElementById('toggle-ai').addEventListener('click', () => switchView('ai'));
        document.getElementById('toggle-manual').addEventListener('click', () => switchView('manual'));
        document.getElementById('submit-btn').addEventListener('click', handleAIParse);
        document.getElementById('manual-form').addEventListener('submit', handleManualSave);
    });

    function switchView(mode) {
        const ai = mode === 'ai';
        document.getElementById('toggle-ai').classList.toggle('active', ai);
        document.getElementById('toggle-manual').classList.toggle('active', !ai);
        document.getElementById('ai-view').classList.toggle('hidden', !ai);
        document.getElementById('manual-view').classList.toggle('hidden', ai);
    }

    // Add a recipe to the community (which assigns its id), then store that
    // same recipe in the user's personal cloud collection.
    async function saveRecipeEverywhere(recipe) {
        const communityRecipe = await addToCommunity(recipe);  // throws on failure
        try {
            await addMyRecipe(communityRecipe);
        } catch (err) {
            // Community save worked; personal copy failed. Report but don't lose it.
            return { recipe: communityRecipe, personalSaved: false, error: err.message };
        }
        return { recipe: communityRecipe, personalSaved: true };
    }

    async function handleManualSave(e) {
        e.preventDefault();
        const ingLines = document.getElementById('manual-ingredients').value.split('\n').map(l => l.trim()).filter(Boolean);
        const instLines = document.getElementById('manual-instructions').value.split('\n').map(l => l.trim()).filter(Boolean);

        const recipe = {
            title: document.getElementById('manual-title').value.trim(),
            category: document.getElementById('manual-category').value,
            prepTime: document.getElementById('manual-time').value.trim() || 'Unspecified',
            ingredients: ingLines,
            instructions: instLines,
            sourceUrl: document.getElementById('manual-url').value.trim() || null
        };

        updateStatus("Saving...", "loading");
        try {
            const result = await saveRecipeEverywhere(recipe);
            if (result.personalSaved) {
                showAlert(`🎉 Saved "${result.recipe.title}" to your collection and shared with the community!`, "success");
            } else {
                showAlert(`Shared "${result.recipe.title}" to the community, but adding to your collection failed: ${result.error}`, "error");
            }
            document.getElementById('manual-form').reset();
        } catch (err) {
            showAlert(`Couldn't save: ${err.message}`, "error");
        }
    }

    async function handleAIParse() {
        const inputField = document.getElementById('recipe-input');
        const inputData = inputField.value.trim();

        if (!inputData) {
            showAlert("Please enter a URL or paste text before parsing.", "error");
            return;
        }

        updateStatus("Parsing with AI...", "loading");
        try {
            const response = await fetch(`${APP_CONFIG.CLOUDFLARE_BRIDGE_URL}/parse`, {
                method: 'POST',
                headers: AUTH.headers({ 'Content-Type': 'application/json' }),
                body: JSON.stringify({ recipeText: inputData })
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.error || `Parser returned ${response.status}`);

            const rawJsonText = data.candidates[0].content.parts[0].text;
            const parsedRecipe = JSON.parse(rawJsonText.replace(/```json|```/g, ''));

            updateStatus("Saving...", "loading");
            const result = await saveRecipeEverywhere(parsedRecipe);

            if (result.personalSaved) {
                updateStatus(`🎉 Added "${result.recipe.title}" to your collection and the community!`, "success");
            } else {
                updateStatus(`Shared "${result.recipe.title}" to the community, but adding to your collection failed: ${result.error}`, "error");
            }
            inputField.value = "";
        } catch (error) {
            console.error(error);
            updateStatus(`Couldn't parse that recipe: ${error.message}`, "error");
        }
    }

    function updateStatus(msg, type) {
        const box = document.getElementById('status-message');
        box.innerText = msg;
        box.className = `status-box ${type}`;
    }

    function showAlert(msg, type) {
        updateStatus(msg, type);
        setTimeout(() => {
            document.getElementById('status-message').className = "status-box hidden";
        }, 6000);
    }
  </script>
</body>
</html>
