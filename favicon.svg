<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Book body -->
  <rect x="5" y="3" width="22" height="26" rx="2" fill="#10b981"/>
  <!-- Spine (darker emerald) -->
  <rect x="5" y="3" width="2.5" height="26" fill="#059669"/>
  <!-- Page edge highlight -->
  <line x1="26.3" y1="5" x2="26.3" y2="27" stroke="#ecfdf5" stroke-width="0.4"/>

  <!-- Chef hat: three puffy circles on top -->
  <circle cx="12" cy="13" r="2.5" fill="white"/>
  <circle cx="16" cy="11" r="3" fill="white"/>
  <circle cx="20" cy="13" r="2.5" fill="white"/>
  <!-- Chef hat base -->
  <rect x="11" y="14" width="10" height="6" fill="white"/>
  <!-- Hat band detail -->
  <rect x="11" y="18" width="10" height="2" fill="#d1fae5"/>
</svg>
