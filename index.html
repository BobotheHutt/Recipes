<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Recipe Collection</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/themes.js" defer></script>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="index.html" class="nav-link active">My Collection</a>
    <a href="explore.html" class="nav-link">Explore Community</a>
    <a href="collection.html" class="nav-link">Add Recipes</a>
    
    <!-- Inline Theme Selector -->
    <select id="theme-select" style="margin-left: auto;">
      <option value="light">☀️ Light Emerald</option>
      <option value="dark">🌙 Dark Slate</option>
      <option value="sepia">🍂 Cozy Sepia</option>
    </select>
  </nav>

  <main class="container">
    <h1>My Collection</h1>
    <p>Your personal collection of recipes, saved securely on your device.</p>

    <!-- Search and Filter Control Panel -->
    <div class="controls-panel">
      <input type="text" id="search-bar" placeholder="🔍 Search your saved recipes..." autocomplete="off">
      
      <div class="filter-buttons">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="Breakfast">Breakfast</button>
        <button class="filter-btn" data-category="Lunch">Lunch</button>
        <button class="filter-btn" data-category="Dinner">Dinner</button>
        <button class="filter-btn" data-category="Dessert">Dessert</button>
        <button class="filter-btn" data-category="Snack">Snack</button>
      </div>
    </div>

    <!-- Recipe Grid Display -->
    <div id="recipe-grid" class="recipe-grid"></div>

    <!-- Interactive Manual Editing Overlay Modal Window -->
    <div id="edit-modal" class="modal-overlay hidden">
      <div class="modal-content" style="max-width: 650px; overflow-y: auto; max-height: 85vh;">
        <h3>📝 Edit Recipe</h3>
        <p style="margin-bottom: 16px; font-size: 0.85rem;">Modifying a saved recipe will update your device. If it has a source web link, it will auto-sync back to the community collection!</p>
        
        <form id="edit-form">
          <div class="form-group">
            <label>Recipe Title</label>
            <input type="text" id="edit-title" required>
          </div>
          <div class="form-group">
            <label>Category</label>
            <select id="edit-category">
              <option value="Dinner">Dinner</option>
              <option value="Breakfast">Breakfast</option>
              <option value="Lunch">Lunch</option>
              <option value="Dessert">Dessert</option>
              <option value="Snack">Snack</option>
            </select>
          </div>
          <div class="form-group">
            <label>Preparation Time</label>
            <input type="text" id="edit-time">
          </div>
          <div class="form-group">
            <label>Ingredients (One item per line)</label>
            <textarea id="edit-ingredients" rows="5"></textarea>
          </div>
          <div class="form-group">
            <label>Instructions (One step per line)</label>
            <textarea id="edit-instructions" rows="5"></textarea>
          </div>
          
          <div class="modal-actions" style="flex-direction: row; justify-content: flex-end; gap: 8px;">
            <button type="button" id="close-edit-btn" class="text-btn">Cancel</button>
            <button type="submit" class="primary-btn">💾 Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script>
    // ⚠️ CONFIGURATION: Make sure this points to your exact background Web App endpoint URL
    const GOOGLE_BRIDGE_URL = "PASTE_YOUR_GOOGLE_WEB_APP_URL_HERE";

    let currentCategory = 'all';
    let activeEditingIndex = null;

    document.addEventListener('DOMContentLoaded', () => {
        renderPrivateRecipes();
        setupFilterListeners();
        setupInterfaceActions();
    });

    function renderPrivateRecipes() {
        const grid = document.getElementById('recipe-grid');
        const searchKeyword = document.getElementById('search-bar').value.toLowerCase().trim();
        const privateRecipes = getRecipes(); 
        grid.innerHTML = '';

        const filteredRecipes = privateRecipes.filter(recipe => {
            const matchesCategory = (currentCategory === 'all' || recipe.category === currentCategory);
            const matchesSearch = !searchKeyword || 
                recipe.title.toLowerCase().includes(searchKeyword) ||
                recipe.category.toLowerCase().includes(searchKeyword) ||
                recipe.ingredients.some(ing => ing.toLowerCase().includes(searchKeyword));

            return matchesCategory && matchesSearch;
        });

        if (filteredRecipes.length === 0) {
            grid.innerHTML = `<p class="empty-state">No matching recipes found in your collection.</p>`;
            return;
        }

        filteredRecipes.forEach((recipe, index) => {
            const card = document.createElement('div');
            card.className = 'recipe-card';
            card.innerHTML = `
                <div class="card-header">
                    <span class="badge">${recipe.category}</span>
                    <button class="print-btn" data-index="${index}">🖨️ Print</button>
                    <button class="edit-btn" data-index="${index}" style="font-size:0.8rem; padding:4px 8px; background:#f0fdfa; color:#0d9488; border:1px solid #99f6e4; border-radius:6px;">✏️ Edit</button>
                    <button class="delete-btn" data-index="${index}">🗑️ Delete</button>
                </div>
                <h3>${recipe.title}</h3>
                <p class="meta-info">⏱️ Prep: ${recipe.prepTime}</p>
                <details>
                    <summary>View Recipe Details</summary>
                    <h4>Ingredients:</h4>
                    <ul>${recipe.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>
                    <h4>Instructions:</h4>
                    <ol>${recipe.instructions.map(s => `<li>${s}</li>`).join('')}</ol>
                    ${recipe.sourceUrl ? `<a href="${recipe.sourceUrl}" target="_blank" class="source-link">Original Source ↗</a>` : ''}
                </details>
            `;
            grid.appendChild(card);
        });
    }

    function setupFilterListeners() {
        document.getElementById('search-bar').addEventListener('input', renderPrivateRecipes);

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                
                currentCategory = e.target.dataset.category;
                renderPrivateRecipes();
            });
        });
    }

    function setupInterfaceActions() {
        const grid = document.getElementById('recipe-grid');
        
        grid.addEventListener('click', (e) => {
            if (e.target.classList.contains('print-btn')) {
                const cardElement = e.target.closest('.recipe-card');
                const detailContainer = cardElement.querySelector('details');
                const originalState = detailContainer.hasAttribute('open');
                
                detailContainer.setAttribute('open', '');
                window.print();
                if (!originalState) detailContainer.removeAttribute('open');
            }

            // Launch Edit Modal Window
            if (e.target.classList.contains('edit-btn')) {
                activeEditingIndex = parseInt(e.target.dataset.index, 10);
                const recipe = getRecipes()[activeEditingIndex];
                
                document.getElementById('edit-title').value = recipe.title;
                document.getElementById('edit-category').value = recipe.category;
                document.getElementById('edit-time').value = recipe.prepTime === 'Parsing...' ? '' : recipe.prepTime;
                document.getElementById('edit-ingredients').value = recipe.ingredients.join('\n');
                document.getElementById('edit-instructions').value = recipe.instructions.join('\n');
                
                document.getElementById('edit-modal').classList.remove('hidden');
            }

            if (e.target.classList.contains('delete-btn')) {
                const targetIndex = parseInt(e.target.dataset.index, 10);
                const privateRecipes = getRecipes();
                const targetRecipe = privateRecipes[targetIndex];

                if (confirm(`Are you sure you want to delete "${targetRecipe.title}" from your collection?`)) {
                    privateRecipes.splice(targetIndex, 1);
                    localStorage.setItem('my_recipes', JSON.stringify(privateRecipes));
                    renderPrivateRecipes();
                }
            }
        });

        // Close Edit Window handlers
        document.getElementById('close-edit-btn').addEventListener('click', () => {
            document.getElementById('edit-modal').classList.add('hidden');
            activeEditingIndex = null;
        });

        document.getElementById('edit-form').addEventListener('submit', handleRecipeEditsSave);
    }

    async function handleRecipeEditsSave(e) {
        e.preventDefault();
        if (activeEditingIndex === null) return;

        const privateRecipes = getRecipes();
        const originalRecipe = privateRecipes[activeEditingIndex];

        // Package Modified Object Values
        const ingLines = document.getElementById('edit-ingredients').value.split('\n').map(l => l.trim()).filter(Boolean);
        const instLines = document.getElementById('edit-instructions').value.split('\n').map(l => l.trim()).filter(Boolean);

        const updatedRecipe = {
            title: document.getElementById('edit-title').value.trim(),
            category: document.getElementById('edit-category').value,
            prepTime: document.getElementById('edit-time').value.trim() || 'Unspecified',
            ingredients: ingLines,
            instructions: instLines,
            sourceUrl: originalRecipe.sourceUrl // Retain historical tracking connection pointer
        };

        // 1. Commit modifications instantly to her device LocalStorage array
        privateRecipes[activeEditingIndex] = updatedRecipe;
        localStorage.setItem('my_recipes', JSON.stringify(privateRecipes));
        renderPrivateRecipes();
        document.getElementById('edit-modal').classList.add('hidden');

        // 2. Invisible Sync Pipeline: If it has a source URL link, update global database in background
        if (updatedRecipe.sourceUrl) {
            try {
                // Send payload string down across to the same Google bridge script
                fetch(GOOGLE_BRIDGE_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        recipeText: JSON.stringify(updatedRecipe),
                        isEditSync: true // Helper payload flag
                    })
                });
                alert(`Saved locally! Global community card will update in about 15 seconds.`);
            } catch (err) {
                console.error("Global database synchronization event failed:", err);
            }
        } else {
            alert("Recipe updated successfully in your private collection!");
        }
        
        activeEditingIndex = null;
    }
  </script>
</body>
</html>
