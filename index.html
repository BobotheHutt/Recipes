<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // Apply saved theme's background instantly so loading never flashes white.
    (function () {
      var t = localStorage.getItem('site_theme') || 'light';
      var bg = { light: '#f9fafb', dark: '#0f172a', sepia: '#f4eae1' }[t] || '#f9fafb';
      document.documentElement.style.backgroundColor = bg;
      document.body && (document.body.style.backgroundColor = bg);
    })();
  </script>
  <title>Recipe Collection</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js" defer></script>
  <script src="js/themes.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/storage.js" defer></script>
  <script src="js/views.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>

  <!-- Permanent navbar — built once, never reloaded -->
  <nav class="navbar">
    <a href="#collection" class="nav-link" data-route="collection">My Collection</a>
    <a href="#explore" class="nav-link" data-route="explore">Explore Community</a>
    <a href="#add" class="nav-link" data-route="add">Add Recipes</a>
    <a href="#admin" class="nav-link" data-route="admin" id="admin-nav-link" style="display:none;">Admin</a>

    <div id="settings-menu" class="settings-menu">
      <button id="settings-btn" class="settings-btn" aria-label="Settings">⚙ Settings</button>
      <div id="settings-panel" class="settings-panel hidden">
        <div class="settings-row settings-user" id="settings-username">👤</div>
        <div class="settings-row">
          <label for="theme-select">Theme</label>
          <select id="theme-select">
            <option value="light">☀️ Light Emerald</option>
            <option value="dark">🌙 Dark Slate</option>
            <option value="sepia">🍂 Cozy Sepia</option>
          </select>
        </div>
        <div class="settings-row">
          <label for="images-toggle">Show recipe images</label>
          <input type="checkbox" id="images-toggle">
        </div>
        <button id="logout-btn" class="settings-logout">Log out</button>
      </div>
    </div>
  </nav>

  <!-- Tab content is rendered in here; the navbar above never changes -->
  <main class="container" id="app-content"></main>

  <!-- Shared edit modal, used by the Collection and Explore views -->
  <div id="edit-modal" class="modal-overlay hidden">
    <div class="modal-content" style="max-width: 650px; overflow-y: auto; max-height: 85vh;">
      <h3 id="edit-modal-title">📝 Edit Recipe</h3>
      <p id="edit-modal-note" style="margin-bottom: 16px; font-size: 0.85rem;"></p>
      <form id="edit-form">
        <div class="form-group">
          <label>Recipe Title</label>
          <input type="text" id="edit-title" required>
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="edit-category">
            <option value="Dinner">Dinner</option>
            <option value="Breakfast">Breakfast</option>
            <option value="Lunch">Lunch</option>
            <option value="Dessert">Dessert</option>
            <option value="Snack">Snack</option>
          </select>
        </div>
        <div class="form-group">
          <label>Preparation Time</label>
          <input type="text" id="edit-time">
        </div>
        <div class="form-group">
          <label>Ingredients (One item per line)</label>
          <textarea id="edit-ingredients" rows="5"></textarea>
        </div>
        <div class="form-group">
          <label>Instructions (One step per line)</label>
          <textarea id="edit-instructions" rows="5"></textarea>
        </div>
        <div class="form-group">
          <label>Image link (Optional)</label>
          <input type="url" id="edit-image" placeholder="https://site.com/photo.jpg">
        </div>
        <div class="modal-actions" style="flex-direction: row; justify-content: flex-end; gap: 8px;">
          <button type="button" id="close-edit-btn" class="text-btn">Cancel</button>
          <button type="submit" class="primary-btn">💾 Save Changes</button>
        </div>
      </form>
    </div>
  <!-- Image picker modal — shown after parsing when the page offered photos -->
  <div id="image-modal" class="modal-overlay hidden">
    <div class="modal-content" style="max-width: 640px; overflow-y: auto; max-height: 85vh;">
      <h3>🖼️ Choose a Photo</h3>
      <p style="margin-bottom: 16px; font-size: 0.85rem;">Pick a photo for this recipe, paste your own image link, or skip.</p>
      <div id="image-choices" class="image-choices"></div>
      <div class="form-group" style="margin-top:16px;">
        <label>Or paste your own image link</label>
        <input type="url" id="image-custom" placeholder="https://site.com/photo.jpg">
      </div>
      <div class="modal-actions" style="flex-direction: row; justify-content: flex-end; gap: 8px;">
        <button type="button" id="image-skip-btn" class="text-btn">Skip — no image</button>
        <button type="button" id="image-confirm-btn" class="primary-btn">Use selected photo</button>
      </div>
    </div>
  </div>

</body>
</html>
