<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // Set the theme class on <html> immediately, before the stylesheet loads,
    // so the page paints in the correct theme with no flash. The actual colors
    // live in style.css (html.theme-dark / html.theme-sepia) — not duplicated
    // here — so there is one source of truth for theme colors.
    (function () {
      var t = 'light';
      try { var p = JSON.parse(localStorage.getItem('account_prefs') || '{}'); if (p.theme) t = p.theme; } catch (e) {}
      if (t !== 'light') document.documentElement.className = 'theme-' + t;
    })();
  </script>
  <title>Recipe Collection</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js" defer></script>
  <script src="js/themes.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/storage.js" defer></script>
  <script src="js/views.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>

  <!-- Permanent navbar — built once, never reloaded -->
  <nav class="navbar">
    <a href="#collection" class="nav-link" data-route="collection">My Collection</a>
    <a href="#explore" class="nav-link" data-route="explore">Explore Community</a>
    <a href="#add" class="nav-link" data-route="add">Add Recipes</a>
    <a href="#admin" class="nav-link" data-route="admin" id="admin-nav-link" style="display:none;">Admin</a>

    <div id="settings-menu" class="settings-menu">
      <button id="settings-btn" class="settings-btn" aria-label="Settings" title="Settings">⚙</button>
      <div id="settings-panel" class="settings-panel hidden">
        <div class="settings-row settings-user" id="settings-username">👤</div>
        <div class="settings-row">
          <label for="theme-select">Theme</label>
          <select id="theme-select">
            <option value="light">☀️ Light Emerald</option>
            <option value="dark">🌙 Dark Slate</option>
            <option value="sepia">🍂 Cozy Sepia</option>
          </select>
        </div>
        <div class="settings-row">
          <label for="images-toggle">Show recipe images</label>
          <input type="checkbox" id="images-toggle">
        </div>
        <div class="settings-row">
          <label for="autoshare-toggle">Auto-share new recipes to community</label>
          <input type="checkbox" id="autoshare-toggle">
        </div>
        <button id="change-password-btn" class="settings-logout" style="margin-bottom:6px;">Change Password</button>
        <button id="logout-btn" class="settings-logout">Log out</button>
      </div>
    </div>
  </nav>

  <!-- Tab content is rendered in here; the navbar above never changes -->
  <main class="container" id="app-content"></main>

  <!-- Shared edit modal, used by the Collection and Explore views -->
  <div id="edit-modal" class="modal-overlay hidden">
    <div class="modal-content" style="max-width: 650px; overflow-y: auto; max-height: 85vh;">
      <h3 id="edit-modal-title">📝 Edit Recipe</h3>
      <p id="edit-modal-note" style="margin-bottom: 16px; font-size: 0.85rem;"></p>
      <form id="edit-form">
        <div class="form-group">
          <label>Recipe Title</label>
          <input type="text" id="edit-title" required>
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="edit-category">
            <option value="Dinner">Dinner</option>
            <option value="Breakfast">Breakfast</option>
            <option value="Lunch">Lunch</option>
            <option value="Dessert">Dessert</option>
            <option value="Snack">Snack</option>
          </select>
        </div>
        <div class="form-group">
          <label>Total Time (minutes)</label>
          <input type="number" id="edit-time" min="0">
        </div>
        <div class="form-group">
          <label>Description / Notes (Optional)</label>
          <textarea id="edit-description" rows="2"></textarea>
        </div>
        <div class="form-group">
          <label>Ingredients (One item per line)</label>
          <textarea id="edit-ingredients" rows="5"></textarea>
        </div>
        <div class="form-group">
          <label>Instructions (One step per line)</label>
          <textarea id="edit-instructions" rows="5"></textarea>
        </div>
        <div class="form-group">
          <label>Image link (Optional)</label>
          <input type="url" id="edit-image" placeholder="https://site.com/photo.jpg">
        </div>
        <div class="modal-actions" style="flex-direction: row; justify-content: flex-end; gap: 8px;">
          <button type="button" id="close-edit-btn" class="text-btn">Cancel</button>
          <button type="submit" class="primary-btn">💾 Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Change password modal -->
  <div id="password-modal" class="modal-overlay hidden">
    <div class="modal-content" style="max-width: 440px;">
      <h3>🔑 Change Password</h3>
      <p style="margin-bottom: 16px; font-size: 0.85rem;">Enter your current password, then choose a new one.</p>
      <form id="password-form">
        <div class="form-group">
          <label>Current Password</label>
          <div class="password-wrap">
            <input type="password" id="pw-current" required>
            <button type="button" class="password-toggle" data-target="pw-current" aria-label="Show password">👁️</button>
          </div>
        </div>
        <div class="form-group">
          <label>New Password</label>
          <div class="password-wrap">
            <input type="password" id="pw-new" required>
            <button type="button" class="password-toggle" data-target="pw-new" aria-label="Show password">👁️</button>
          </div>
        </div>
        <div class="form-group">
          <label>Confirm New Password</label>
          <div class="password-wrap">
            <input type="password" id="pw-new2" required>
            <button type="button" class="password-toggle" data-target="pw-new2" aria-label="Show password">👁️</button>
          </div>
        </div>
        <div id="password-status" class="status-box hidden" style="margin-bottom:12px;"></div>
        <div class="modal-actions" style="flex-direction: row; justify-content: flex-end; gap: 8px;">
          <button type="button" id="close-password-btn" class="text-btn">Cancel</button>
          <button type="submit" class="primary-btn">💾 Change Password</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Image picker builds its own overlay in JS (see pickImage in app.js) -->

</body>
</html>
