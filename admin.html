<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Recipe Collection</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js" defer></script>
  <script src="js/themes.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="nav-link">My Collection</a>
    <a href="explore.html" class="nav-link">Explore Community</a>
    <a href="collection.html" class="nav-link">Add Recipes</a>
  </nav>

  <main class="container" style="max-width: 720px;">
    <h1>Admin Panel</h1>
    <p>Manage accounts. Only admins can see this page.</p>

    <div class="input-card">
      <h3 style="margin-bottom:16px;">Reset a Password</h3>
      <div class="form-group">
        <label>Account</label>
        <select id="reset-account"></select>
      </div>
      <div class="form-group">
        <label>New Password</label>
        <input type="text" id="reset-password" placeholder="At least 4 characters">
      </div>
      <p style="font-size:0.8rem;">The new password is shown as plain text so you can read it back to the person.</p>
      <div class="actions">
        <button id="reset-btn" class="primary-btn">Reset Password</button>
      </div>
    </div>

    <h3 style="margin:32px 0 12px;">All Accounts</h3>
    <div id="account-list" class="recipe-grid"></div>

    <div id="status-message" class="status-box hidden" style="margin-top:20px;"></div>
  </main>

  <script>
    let accounts = [];

    document.addEventListener('DOMContentLoaded', async () => {
        const session = await requireLogin();
        if (!session) return;

        if (!session.isAdmin) {
            document.querySelector('main').innerHTML =
                '<h1>Admin Panel</h1><p>This page is for admins only.</p>';
            return;
        }

        document.getElementById('reset-btn').addEventListener('click', handleReset);
        await loadAccounts();
    });

    async function loadAccounts() {
        try {
            const res = await fetch(`${APP_CONFIG.CLOUDFLARE_BRIDGE_URL}/admin/accounts`, {
                headers: AUTH.headers()
            });
            if (!res.ok) throw new Error('Could not load accounts');
            accounts = await res.json();
            renderAccountSelect();
            renderAccountList();
        } catch (e) {
            showStatus(e.message, "error");
        }
    }

    function renderAccountSelect() {
        const select = document.getElementById('reset-account');
        select.innerHTML = accounts
            .map(a => `<option value="${a.username}">${a.username}</option>`)
            .join('');
    }

    function renderAccountList() {
        const grid = document.getElementById('account-list');
        if (accounts.length === 0) {
            grid.innerHTML = `<p class="empty-state">No accounts yet.</p>`;
            return;
        }
        grid.innerHTML = '';
        accounts.forEach(a => {
            const card = document.createElement('div');
            card.className = 'recipe-card';
            const created = a.createdAt ? new Date(a.createdAt).toLocaleDateString() : 'unknown';
            card.innerHTML = `
                <h3>${a.username}</h3>
                <p class="meta-info">${a.isAdmin ? '🔑 Admin' : '👤 Member'}</p>
                <p style="font-size:0.8rem; color:var(--text-muted);">Joined: ${created}</p>
            `;
            grid.appendChild(card);
        });
    }

    async function handleReset() {
        const targetUsername = document.getElementById('reset-account').value;
        const newPassword = document.getElementById('reset-password').value;

        if (!targetUsername) { showStatus("Pick an account.", "error"); return; }
        if (!newPassword || newPassword.length < 4) {
            showStatus("New password must be at least 4 characters.", "error");
            return;
        }

        showStatus("Resetting...", "loading");
        try {
            const res = await fetch(`${APP_CONFIG.CLOUDFLARE_BRIDGE_URL}/admin/reset-password`, {
                method: 'POST',
                headers: AUTH.headers({ 'Content-Type': 'application/json' }),
                body: JSON.stringify({ targetUsername, newPassword })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Reset failed');

            showStatus(`Password for "${targetUsername}" is now: ${newPassword}`, "success");
            document.getElementById('reset-password').value = '';
        } catch (e) {
            showStatus(e.message, "error");
        }
    }

    function showStatus(msg, type) {
        const box = document.getElementById('status-message');
        box.innerText = msg;
        box.className = `status-box ${type}`;
    }
  </script>
</body>
</html>
