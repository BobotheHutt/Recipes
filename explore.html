<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Community Recipes</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js" defer></script>
  <script src="js/themes.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="nav-link">My Collection</a>
    <a href="explore.html" class="nav-link active">Explore Community</a>
    <a href="collection.html" class="nav-link">Add Recipes</a>
  </nav>

  <main class="container">
    <h1>Community Recipes</h1>
    <p>Recipes shared by everyone using this site.</p>

    <div class="controls-panel">
      <input type="text" id="search-bar" placeholder="🔍 Search ingredients, titles..." autocomplete="off">
      <div class="filter-buttons">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="Breakfast">Breakfast</button>
        <button class="filter-btn" data-category="Lunch">Lunch</button>
        <button class="filter-btn" data-category="Dinner">Dinner</button>
        <button class="filter-btn" data-category="Dessert">Dessert</button>
        <button class="filter-btn" data-category="Snack">Snack</button>
      </div>
    </div>

    <div id="global-grid" class="recipe-grid"></div>

    <div id="edit-modal" class="modal-overlay hidden">
      <div class="modal-content" style="max-width: 650px; overflow-y: auto; max-height: 85vh;">
        <h3>📝 Edit Community Recipe (Admin)</h3>
        <p style="margin-bottom: 16px; font-size: 0.85rem;">Editing as Admin. Changes go directly to the community for everyone.</p>
        <form id="edit-form">
          <div class="form-group">
            <label>Recipe Title</label>
            <input type="text" id="edit-title" required>
          </div>
          <div class="form-group">
            <label>Category</label>
            <select id="edit-category">
              <option value="Dinner">Dinner</option>
              <option value="Breakfast">Breakfast</option>
              <option value="Lunch">Lunch</option>
              <option value="Dessert">Dessert</option>
              <option value="Snack">Snack</option>
            </select>
          </div>
          <div class="form-group">
            <label>Preparation Time</label>
            <input type="text" id="edit-time">
          </div>
          <div class="form-group">
            <label>Ingredients (One item per line)</label>
            <textarea id="edit-ingredients" rows="5"></textarea>
          </div>
          <div class="form-group">
            <label>Instructions (One step per line)</label>
            <textarea id="edit-instructions" rows="5"></textarea>
          </div>
          <div class="modal-actions" style="flex-direction: row; justify-content: flex-end; gap: 8px;">
            <button type="button" id="close-edit-btn" class="text-btn">Cancel</button>
            <button type="submit" class="primary-btn">💾 Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script>
    let allGlobalRecipes = [];
    let currentCategory = 'all';
    let activeEditingId = null;
    let myUsername = null;
    let amAdmin = false;

    document.addEventListener('DOMContentLoaded', async () => {
        const session = await requireLogin();
        if (!session) return;
        myUsername = session.username;
        amAdmin = session.isAdmin;

        setupFilterListeners();
        setupInterfaceActions();
        await loadRecipes();
    });

    async function loadRecipes() {
        const grid = document.getElementById('global-grid');
        grid.innerHTML = `<p class="empty-state">Loading community recipes...</p>`;
        allGlobalRecipes = await getGlobalRecipes();
        renderRecipes();
    }

    function renderRecipes() {
        const grid = document.getElementById('global-grid');
        const searchKeyword = document.getElementById('search-bar').value.toLowerCase().trim();
        grid.innerHTML = '';

        const filtered = allGlobalRecipes.filter(recipe => {
            const matchesCategory = (currentCategory === 'all' || recipe.category === currentCategory);
            const matchesSearch = !searchKeyword ||
                recipe.title.toLowerCase().includes(searchKeyword) ||
                recipe.category.toLowerCase().includes(searchKeyword) ||
                recipe.ingredients.some(ing => ing.toLowerCase().includes(searchKeyword));
            return matchesCategory && matchesSearch;
        });

        if (filtered.length === 0) {
            grid.innerHTML = `<p class="empty-state">No matching community recipes found.</p>`;
            return;
        }

        filtered.forEach(recipe => {
            const card = document.createElement('div');
            card.className = 'recipe-card';
            const authorTag = recipe.uploader ? `👤 Added by: ${recipe.uploader}` : '👤 Added by: Guest';

            // Edit/Delete shown to the recipe's owner OR to an admin
            const canManage = amAdmin || recipe.uploader === myUsername;
            const manageItems = canManage ? `
                <button class="action-menu-item edit-action" data-id="${recipe.id}">✏️ Edit</button>
                <button class="action-menu-item danger delete-action" data-id="${recipe.id}">🗑️ Delete</button>
            ` : '';

            card.innerHTML = `
                <div class="card-header">
                    <span class="badge">${recipe.category}</span>
                    <div class="action-menu">
                        <button class="action-menu-btn">⋯ Actions</button>
                        <div class="action-menu-panel hidden">
                            <button class="action-menu-item print-action">🖨️ Print</button>
                            <button class="action-menu-item save-action" data-id="${recipe.id}">📥 Add to Collection</button>
                            ${manageItems}
                        </div>
                    </div>
                </div>
                <h3>${recipe.title}</h3>
                <p class="meta-info" style="margin-bottom:4px;">⏱️ Prep: ${recipe.prepTime}</p>
                <p style="font-size:0.8rem; font-style:italic; color:var(--text-muted); margin-bottom:16px;">${authorTag}</p>
                <details>
                    <summary>View Recipe Details</summary>
                    <h4>Ingredients:</h4>
                    <ul>${recipe.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>
                    <h4>Instructions:</h4>
                    <ol>${recipe.instructions.map(s => `<li>${s}</li>`).join('')}</ol>
                    ${recipe.sourceUrl ? `<a href="${recipe.sourceUrl}" target="_blank" class="source-link">Original Source ↗</a>` : ''}
                </details>
            `;
            grid.appendChild(card);
        });
    }

    function setupFilterListeners() {
        document.getElementById('search-bar').addEventListener('input', renderRecipes);
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentCategory = e.target.dataset.category;
                renderRecipes();
            });
        });
    }

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.action-menu')) closeAllMenus();
    });

    function closeAllMenus() {
        document.querySelectorAll('.action-menu-panel').forEach(p => p.classList.add('hidden'));
    }

    function setupInterfaceActions() {
        const grid = document.getElementById('global-grid');

        grid.addEventListener('click', async (e) => {
            const target = e.target;

            if (target.classList.contains('action-menu-btn')) {
                const panel = target.nextElementSibling;
                const isHidden = panel.classList.contains('hidden');
                closeAllMenus();
                if (isHidden) panel.classList.remove('hidden');
                return;
            }

            if (target.classList.contains('print-action')) {
                closeAllMenus();
                const card = target.closest('.recipe-card');
                const details = card.querySelector('details');
                const wasOpen = details.hasAttribute('open');
                details.setAttribute('open', '');
                window.print();
                if (!wasOpen) details.removeAttribute('open');
                return;
            }

            if (target.classList.contains('save-action')) {
                closeAllMenus();
                const recipe = allGlobalRecipes.find(r => r.id === target.dataset.id);
                if (!recipe) return;
                try {
                    await addMyRecipe(recipe);
                    alert(`Added "${recipe.title}" to your collection!`);
                } catch (err) {
                    alert("Couldn't add to your collection: " + err.message);
                }
                return;
            }

            if (target.classList.contains('edit-action')) {
                closeAllMenus();
                const recipe = allGlobalRecipes.find(r => r.id === target.dataset.id);
                if (recipe) openEditModal(recipe);
                return;
            }

            if (target.classList.contains('delete-action')) {
                closeAllMenus();
                const recipe = allGlobalRecipes.find(r => r.id === target.dataset.id);
                if (!recipe) return;
                if (!confirm(`Delete "${recipe.title}" from the community? This affects everyone.`)) return;
                try {
                    await deleteFromCommunity(recipe.id);
                    allGlobalRecipes = allGlobalRecipes.filter(r => r.id !== recipe.id);
                    renderRecipes();
                } catch (err) {
                    alert("Couldn't delete: " + err.message);
                }
                return;
            }
        });

        document.getElementById('close-edit-btn').addEventListener('click', closeEditModal);
        document.getElementById('edit-form').addEventListener('submit', handleEditSave);
    }

    function openEditModal(recipe) {
        activeEditingId = recipe.id;
        document.getElementById('edit-title').value = recipe.title;
        document.getElementById('edit-category').value = recipe.category;
        document.getElementById('edit-time').value = recipe.prepTime;
        document.getElementById('edit-ingredients').value = recipe.ingredients.join('\n');
        document.getElementById('edit-instructions').value = recipe.instructions.join('\n');
        document.getElementById('edit-modal').classList.remove('hidden');
    }

    function closeEditModal() {
        document.getElementById('edit-modal').classList.add('hidden');
        activeEditingId = null;
    }

    async function handleEditSave(e) {
        e.preventDefault();
        if (!activeEditingId) return;

        const original = allGlobalRecipes.find(r => r.id === activeEditingId);
        if (!original) { closeEditModal(); return; }

        const ingLines = document.getElementById('edit-ingredients').value.split('\n').map(l => l.trim()).filter(Boolean);
        const instLines = document.getElementById('edit-instructions').value.split('\n').map(l => l.trim()).filter(Boolean);

        const updated = {
            ...original,
            title: document.getElementById('edit-title').value.trim(),
            category: document.getElementById('edit-category').value,
            prepTime: document.getElementById('edit-time').value.trim() || 'Unspecified',
            ingredients: ingLines,
            instructions: instLines
        };

        try {
            const saved = await updateInCommunity(updated.id, updated);
            const idx = allGlobalRecipes.findIndex(r => r.id === saved.id);
            if (idx !== -1) allGlobalRecipes[idx] = saved;
            renderRecipes();
            closeEditModal();
        } catch (err) {
            alert("Couldn't save changes: " + err.message);
        }
    }
  </script>
</body>
</html>
